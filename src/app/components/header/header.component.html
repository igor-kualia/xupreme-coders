<header class="border-b border-border bg-card shadow-sm">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo/Brand -->
      <div class="flex items-center space-x-8">
        <a routerLink="/dashboard"><img src="assets/key.svg" class="w-12"></a>

        <!-- Navigation Links -->
        @if (isAuthenticated()) {
          <nav class="flex space-x-6">
            <a
              routerLink="/dashboard"
              routerLinkActive="!text-slate-900"
              [routerLinkActiveOptions]="{ exact: true }"
              class="text-sm tracking-wide font-medium text-muted-foreground transition-colors hover:text-slate-900"
            >
              Chat
            </a>
            <a
              routerLink="/accounts"
              routerLinkActive="!text-slate-900"
              class="text-sm tracking-wide font-medium text-muted-foreground transition-colors hover:text-slate-900"
            >
              Accounts
            </a>
            <a
              routerLink="/transactions"
              routerLinkActive="!text-slate-900"
              class="text-sm tracking-wide font-medium text-muted-foreground transition-colors hover:text-slate-900"
            >
              Transactions
            </a>
          </nav>
        }
      </div>

      <!-- User Profile Dropdown -->
      @if (isAuthenticated()) {
        <div>
          <button
            type="button"
            class="flex items-center space-x-3 rounded-md px-3 py-2 transition-colors hover:cursor-pointer hover:bg-muted focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
            brnMenuTrigger
            [brnMenuTriggerFor]="userMenu"
            aria-haspopup="menu"
          >
            <!-- User Avatar -->
            @if (user()?.picture) {
              <img
                [src]="user()?.picture"
                alt="User avatar"
                class="h-8 w-8 rounded-full border-2 border-border"
              />
            } @else {
              <div
                class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-border bg-muted"
              >
                <span class="text-xs font-semibold text-muted-foreground">
                  {{ userDisplayName().charAt(0).toUpperCase() }}
                </span>
              </div>
            }

            <!-- User Name -->
            <div class="text-left">
              <p class="text-sm tracking-wide font-medium text-slate-900">{{ userDisplayName() }}</p>
            </div>

            <!-- Chevron Icon -->
            <ng-icon hlm name="lucideChevronDown" size="sm" class="text-muted-foreground" />
          </button>

          <!-- Dropdown Menu -->
          <ng-template #userMenu>
            <hlm-menu class="w-56 cursor:pointer">
              <!-- User Email Label -->
              <hlm-menu-label class="font-normal">
                <p class="text-xs leading-none text-muted-foreground">{{ user()?.email }}</p>
              </hlm-menu-label>

              <hlm-menu-separator />

              <!-- Logout Menu Item -->
              <button hlmMenuItem (click)="logout()" class="cursor-pointer">
                <ng-icon hlm name="lucideLogOut" size="sm" hlmMenuIcon />
                <span>Log Out</span>
              </button>
            </hlm-menu>
          </ng-template>
        </div>
      }
    </div>
  </div>
</header>
