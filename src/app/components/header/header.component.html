<header class="border-border bg-card sticky top-0 z-50 border-b shadow-sm">
  <div class="mx-auto max-w-7xl px-6">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo/Brand -->
      <div class="flex items-center space-x-8">
        <a routerLink="/dashboard" class="hidden items-center space-x-2 md:flex">
          <span class="text-foreground text-xl font-bold">KeyBudget</span>
          <img src="assets/key.svg" alt="KeyBank logo" class="w-12 min-w-12" />
        </a>

        <!-- Navigation Links -->
        @if (isAuthenticated()) {
          <div class="block md:hidden">
            <button
              type="button"
              class="hover:bg-muted focus:ring-ring flex items-center rounded-md px-3 py-2 transition-colors hover:cursor-pointer focus:ring-2 focus:ring-offset-2 focus:outline-none"
              brnMenuTrigger
              [brnMenuTriggerFor]="navMenu"
              aria-haspopup="menu"
            >
              <!-- Hamburger Icon -->
              <ng-icon name="lucideMenu" size="24" />
            </button>

            <!-- Dropdown Menu -->
            <ng-template #navMenu>
              <hlm-menu class="w-56">
                <a
                  hlmMenuItem
                  routerLink="/dashboard"
                  routerLinkActive="font-medium"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="hover:text-foreground cursor-pointer text-sm tracking-wide transition-colors"
                >
                  Chat
                </a>
                <hlm-menu-separator />
                <a
                  hlmMenuItem
                  routerLink="/accounts"
                  routerLinkActive="font-medium"
                  class="hover:text-foreground cursor-pointer text-sm tracking-wide transition-colors"
                >
                  Accounts
                </a>
                <hlm-menu-separator />
                <a
                  hlmMenuItem
                  routerLink="/transactions"
                  routerLinkActive="font-medium"
                  class="hover:text-foreground cursor-pointer text-sm tracking-wide transition-colors"
                >
                  Transactions
                </a>
              </hlm-menu>
            </ng-template>
          </div>

          <nav class="hidden space-x-6 md:flex">
            <a
              routerLink="/dashboard"
              routerLinkActive="!text-foreground"
              [routerLinkActiveOptions]="{ exact: true }"
              class="text-muted-foreground hover:text-foreground text-sm font-medium tracking-wide transition-colors"
            >
              Chat
            </a>
            <a
              routerLink="/accounts"
              routerLinkActive="!text-foreground"
              class="text-muted-foreground hover:text-foreground text-sm font-medium tracking-wide transition-colors"
            >
              Accounts
            </a>
            <a
              routerLink="/transactions"
              routerLinkActive="!text-foreground"
              class="text-muted-foreground hover:text-foreground text-sm font-medium tracking-wide transition-colors"
            >
              Transactions
            </a>
          </nav>
        }
      </div>

      <!-- User Profile Dropdown -->
      @if (isAuthenticated()) {
        <div>
          <button
            type="button"
            class="hover:bg-muted focus:ring-ring flex items-center space-x-3 rounded-md px-3 py-2 transition-colors hover:cursor-pointer focus:ring-2 focus:ring-offset-2 focus:outline-none"
            brnMenuTrigger
            [brnMenuTriggerFor]="userMenu"
            aria-haspopup="menu"
          >
            <!-- User Avatar -->
            @if (user()?.picture) {
              <img [src]="user()?.picture" alt="User avatar" class="border-border h-8 w-8 rounded-full border-2" />
            } @else {
              <div class="border-border bg-muted flex h-8 w-8 items-center justify-center rounded-full border-2">
                <span class="text-muted-foreground text-xs font-semibold">
                  {{ userDisplayName().charAt(0).toUpperCase() }}
                </span>
              </div>
            }

            <!-- User Name -->
            <div class="text-left">
              <p class="text-foreground text-sm font-medium tracking-wide">
                {{ userDisplayName() }}
              </p>
            </div>

            <!-- Chevron Icon -->
            <ng-icon hlm name="lucideChevronDown" size="sm" class="text-muted-foreground" />
          </button>

          <!-- Dropdown Menu -->
          <ng-template #userMenu>
            <hlm-menu class="cursor:pointer w-56">
              <!-- User Email Label -->
              <hlm-menu-label class="font-normal">
                <p class="text-muted-foreground text-xs leading-none">{{ user()?.email }}</p>
              </hlm-menu-label>

              <hlm-menu-separator />

              <!-- Logout Menu Item -->
              <button hlmMenuItem (click)="logout()" class="cursor-pointer tracking-wide">
                <ng-icon hlm name="lucideLogOut" size="sm" hlmMenuIcon />
                <span>Log Out</span>
              </button>
            </hlm-menu>
          </ng-template>
        </div>
      }
    </div>
  </div>
</header>
