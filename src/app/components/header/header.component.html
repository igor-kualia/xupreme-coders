<header class="border-b border-border bg-card shadow-sm">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo/Brand -->
      <div class="flex items-center">
        <a routerLink="/dashboard" class="text-xl font-bold text-foreground">
          XupremeCoders
        </a>
      </div>

      <!-- Navigation and User Menu -->
      @if (isAuthenticated()) {
        <div class="flex items-center space-x-4">
          <!-- User Info -->
          <div class="flex items-center space-x-3">
            <div class="text-right">
              <p class="text-sm font-medium text-foreground">{{ userDisplayName() }}</p>
              <p class="text-xs text-muted-foreground">{{ user()?.email }}</p>
            </div>

            <!-- User Avatar -->
            @if (user()?.picture) {
              <img
                [src]="user()?.picture"
                alt="User avatar"
                class="h-10 w-10 rounded-full border-2 border-border"
              />
            } @else {
              <div class="flex h-10 w-10 items-center justify-center rounded-full border-2 border-border bg-muted">
                <span class="text-sm font-semibold text-muted-foreground">
                  {{ userDisplayName().charAt(0).toUpperCase() }}
                </span>
              </div>
            }
          </div>

          <!-- Logout Button -->
          <button
            type="button"
            (click)="logout()"
            class="rounded-md bg-secondary px-4 py-2 text-sm font-semibold text-secondary-foreground transition-colors hover:bg-secondary/80 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
          >
            Log Out
          </button>
        </div>
      }
    </div>
  </div>
</header>
