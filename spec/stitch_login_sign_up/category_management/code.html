<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manage Categories</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4A90E2",
              "secondary": "#50E3C2",
              "background-light": "#F4F6F8",
              "background-dark": "#122017",
              "text-light": "#333333",
              "text-dark": "#E0E0E0",
              "surface-light": "#FFFFFF",
              "surface-dark": "#1D2C22",
              "border-light": "#E0E0E0",
              "border-dark": "#2A3B2F",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden text-text-light dark:text-text-dark">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm p-4 pb-2 justify-between border-b border-border-light dark:border-border-dark">
<div class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-lg font-bold flex-1 text-center">Categories</h2>
<div class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">search</span>
</div>
</div>
<!-- Segmented Buttons -->
<div class="px-4 py-3 sticky top-[70px] z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-gray-200 dark:bg-black/20 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:shadow-md has-[:checked]:text-white text-text-light dark:text-text-dark text-sm font-medium leading-normal transition-all duration-300">
<span class="truncate">Expenses</span>
<input checked="" class="invisible w-0" name="category-type" type="radio" value="Expenses"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:shadow-md has-[:checked]:text-white text-text-light dark:text-text-dark text-sm font-medium leading-normal transition-all duration-300">
<span class="truncate">Income</span>
<input class="invisible w-0" name="category-type" type="radio" value="Income"/>
</label>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 px-4 pt-2 pb-24">
<div class="space-y-2">
<!-- List Item -->
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 rounded-lg min-h-14 justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-full bg-[#EF5350] shrink-0 size-10">
<span class="material-symbols-outlined">shopping_cart</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate">Groceries</p>
</div>
<div class="shrink-0">
<div class="text-gray-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-3xl">drag_indicator</span>
</div>
</div>
</div>
<!-- List Item -->
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 rounded-lg min-h-14 justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-full bg-[#42A5F5] shrink-0 size-10">
<span class="material-symbols-outlined">train</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate">Transport</p>
</div>
<div class="shrink-0">
<div class="text-gray-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-3xl">drag_indicator</span>
</div>
</div>
</div>
<!-- List Item with Subcategory -->
<div class="flex flex-col gap-2">
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 rounded-lg min-h-14 justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-full bg-[#AB47BC] shrink-0 size-10">
<span class="material-symbols-outlined">theaters</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate">Entertainment</p>
</div>
<div class="shrink-0">
<div class="text-gray-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-3xl">drag_indicator</span>
</div>
</div>
</div>
<!-- Subcategory Item -->
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 rounded-lg min-h-14 justify-between shadow-sm ml-8 border-l-2 border-border-light dark:border-border-dark">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-full bg-[#AB47BC]/70 shrink-0 size-10">
<span class="material-symbols-outlined">movie</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate">Movies</p>
</div>
<div class="shrink-0">
<div class="text-gray-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-3xl">drag_indicator</span>
</div>
</div>
</div>
</div>
<!-- List Item -->
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 rounded-lg min-h-14 justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-full bg-[#FFA726] shrink-0 size-10">
<span class="material-symbols-outlined">home</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate">Rent</p>
</div>
<div class="shrink-0">
<div class="text-gray-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-3xl">drag_indicator</span>
</div>
</div>
</div>
<!-- List Item -->
<div class="flex items-center gap-4 bg-surface-light dark:bg-surface-dark p-3 rounded-lg min-h-14 justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-full bg-[#26A69A] shrink-0 size-10">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate">Utilities</p>
</div>
<div class="shrink-0">
<div class="text-gray-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-3xl">drag_indicator</span>
</div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6 z-20">
<button class="flex size-14 items-center justify-center rounded-full bg-secondary text-white shadow-lg transition hover:bg-secondary/90 focus:outline-none focus:ring-2 focus:ring-secondary/50">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</div>
</body></html>
