<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Monthly Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#38e07b",
            "background-light": "#f6f8f7",
            "background-dark": "#122017",
          },
          fontFamily: {
            display: ["Inter", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between bg-background-light dark:bg-background-dark sticky top-0 z-10">
<div class="flex size-12 shrink-0 items-center justify-start text-slate-800 dark:text-white">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Monthly Plan</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-slate-800 dark:text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<div class="text-slate-800 dark:text-white">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</div>
</button>
</div>
</div>
<!-- Segmented Buttons -->
<div class="flex px-4 py-3">
<div class="flex h-10 flex-1 items-center justify-center rounded-lg bg-slate-200 dark:bg-[#264532] p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-[#122118] has-[:checked]:shadow-sm has-[:checked]:text-slate-900 has-[:checked]:dark:text-white text-slate-500 dark:text-[#96c5a9] text-sm font-medium leading-normal">
<span class="truncate">Budgets</span>
<input checked="" class="invisible w-0" name="plan-toggle" type="radio" value="Budgets"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-[#122118] has-[:checked]:shadow-sm has-[:checked]:text-slate-900 has-[:checked]:dark:text-white text-slate-500 dark:text-[#96c5a9] text-sm font-medium leading-normal">
<span class="truncate">Recurring</span>
<input class="invisible w-0" name="plan-toggle" type="radio" value="Recurring"/>
</label>
</div>
</div>
<!-- Budget Summary Card -->
<div class="px-4 pt-4">
<div class="rounded-xl bg-slate-100 dark:bg-slate-800/50 p-4">
<h3 class="text-slate-900 dark:text-white tracking-light text-2xl font-bold leading-tight text-left pb-2">Total Budget</h3>
<div class="flex flex-col gap-3">
<div class="flex gap-6 justify-between items-end">
<div>
<p class="text-slate-600 dark:text-slate-400 text-sm font-medium leading-normal">Spent this month</p>
<p class="text-slate-900 dark:text-white text-2xl font-bold leading-tight">$1,950.00</p>
</div>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-normal">of $3,000.00</p>
</div>
<div class="rounded-full bg-slate-200 dark:bg-[#366348]">
<div class="h-2 rounded-full bg-primary" style="width: 65%;"></div>
</div>
</div>
</div>
</div>
<!-- Budget Categories List -->
<div class="flex flex-col gap-2 p-4 pb-24">
<!-- List Item 1: Food & Dining -->
<div class="flex gap-4 bg-background-light dark:bg-background-dark px-4 py-3 justify-between items-center rounded-lg border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-4">
<div class="text-slate-800 dark:text-white flex items-center justify-center rounded-full bg-slate-100 dark:bg-[#264532] shrink-0 size-12">
<span class="material-symbols-outlined">restaurant</span>
</div>
<div class="flex flex-1 flex-col justify-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal">Food &amp; Dining</p>
<div class="w-24 rounded-full bg-slate-200 dark:bg-[#366348]">
<div class="h-1.5 rounded-full bg-amber-400" style="width: 85%;"></div>
</div>
<p class="text-slate-500 dark:text-[#96c5a9] text-sm font-normal leading-normal">$340 / $400</p>
</div>
</div>
<div class="shrink-0">
<button class="text-primary text-base font-medium leading-normal">Edit</button>
</div>
</div>
<!-- List Item 2: Shopping -->
<div class="flex gap-4 bg-background-light dark:bg-background-dark px-4 py-3 justify-between items-center rounded-lg border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-4">
<div class="text-slate-800 dark:text-white flex items-center justify-center rounded-full bg-slate-100 dark:bg-[#264532] shrink-0 size-12">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<div class="flex flex-1 flex-col justify-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal">Shopping</p>
<div class="w-24 rounded-full bg-slate-200 dark:bg-[#366348]">
<div class="h-1.5 rounded-full bg-primary" style="width: 40%;"></div>
</div>
<p class="text-slate-500 dark:text-[#96c5a9] text-sm font-normal leading-normal">$200 / $500</p>
</div>
</div>
<div class="shrink-0">
<button class="text-primary text-base font-medium leading-normal">Edit</button>
</div>
</div>
<!-- List Item 3: Transport -->
<div class="flex gap-4 bg-background-light dark:bg-background-dark px-4 py-3 justify-between items-center rounded-lg border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-4">
<div class="text-slate-800 dark:text-white flex items-center justify-center rounded-full bg-slate-100 dark:bg-[#264532] shrink-0 size-12">
<span class="material-symbols-outlined">directions_bus</span>
</div>
<div class="flex flex-1 flex-col justify-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal">Transport</p>
<div class="w-24 rounded-full bg-slate-200 dark:bg-[#366348]">
<div class="h-1.5 rounded-full bg-red-500" style="width: 100%;"></div>
</div>
<p class="text-slate-500 dark:text-[#96c5a9] text-sm font-normal leading-normal">$150 / $150</p>
</div>
</div>
<div class="shrink-0">
<button class="text-primary text-base font-medium leading-normal">Edit</button>
</div>
</div>
<!-- List Item 4: Utilities -->
<div class="flex gap-4 bg-background-light dark:bg-background-dark px-4 py-3 justify-between items-center rounded-lg border border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-4">
<div class="text-slate-800 dark:text-white flex items-center justify-center rounded-full bg-slate-100 dark:bg-[#264532] shrink-0 size-12">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<div class="flex flex-1 flex-col justify-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal">Utilities</p>
<div class="w-24 rounded-full bg-slate-200 dark:bg-[#366348]">
<div class="h-1.5 rounded-full bg-primary" style="width: 75%;"></div>
</div>
<p class="text-slate-500 dark:text-[#96c5a9] text-sm font-normal leading-normal">$225 / $300</p>
</div>
</div>
<div class="shrink-0">
<button class="text-primary text-base font-medium leading-normal">Edit</button>
</div>
</div>
</div>
<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6">
<button class="flex items-center justify-center size-14 rounded-full bg-primary text-white shadow-lg">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</div>
</body></html>
